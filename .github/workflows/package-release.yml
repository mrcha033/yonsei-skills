name: Package student downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: "0.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Choose package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate repository
        run: python3 -B scripts/validate_repo.py
      - name: Build student downloads
        run: python3 -B scripts/build_release_packages.py --version "${{ steps.version.outputs.value }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: yonsei-student-downloads-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.skill
            dist/SHA256SUMS.txt
      - name: Create release if needed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Yonsei Skills $GITHUB_REF_NAME" --generate-notes
      - name: Publish release downloads
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
