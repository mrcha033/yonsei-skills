name: Cross-platform student actions

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  student-actions:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check shuttle, space, and certificate paths
        run: >-
          python -m unittest -v
          tests.test_cross_platform_student_actions
          tests.test_certificate_issue_plan
          tests.test_yonsei_bridge
          tests.test_reportx_agent_startup
          tests.test_reportx_mac_agent
          tests.test_reportx_document_v1
          tests.test_reportx_protocol_v1
          tests.test_reportx_runtime_profile
          tests.test_fp3_pdf
      - name: Compile student action scripts
        run: >-
          python -m compileall -q
          plugins/yonsei-shuttle-booking
          plugins/yonsei-space-reservation
          plugins/yonsei-certificate-assistant
